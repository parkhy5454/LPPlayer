3. 장르/아티스트: 자동 감지 후 title, artist, genre, album, year 필드로 저장, 수동 수정 가능

<!-- NeonDB API Integration -->
<script>
async function neonSaveBeta(email){
  try{
    const r = await fetch('/api/beta', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email})});
    const j = await r.json();
    console.log('Neon beta saved', j);
    return true;
  }catch(e){ console.log('Neon API not available, fallback to local', e); return false; }
}
async function neonSavePlaylist(name, songs){
  try{
    const r = await fetch('/api/playlists', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name, songs})});
    return await r.json();
  }catch(e){ return null; }
}
// Override previous beta signup to use Neon
const origPrompt = window.prompt;
window.neonSignup = async function(email){
  localStorage.setItem('modio_beta_email', email);
  localStorage.setItem('modio_tier','beta');
  await neonSaveBeta(email);
}
</script>

<!-- TRUE SHARED STORAGE: Vercel Blob + NeonDB -->
<script>
// True shared upload: file -> /api/upload -> public URL -> NeonDB
async function uploadFileToSharedStorage(file){
  const filename = `modio_${Date.now()}_${file.name}`;
  const statusEl = document.getElementById('uploadStatus');
  if(statusEl) statusEl.textContent = `업로드 중... ${(file.size/1024/1024).toFixed(1)}MB`;
  try{
    // Upload to Vercel Blob via /api/upload
    const res = await fetch(`/api/upload?filename=${encodeURIComponent(filename)}`, {
      method: 'POST',
      body: file
    });
    if(!res.ok){
      const err = await res.text();
      throw new Error(err);
    }
    const blob = await res.json();
    console.log('Blob uploaded:', blob.url);
    if(statusEl) statusEl.textContent = 'NeonDB에 저장 중...';
    // Save metadata to NeonDB
    await fetch('/api/songs', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        title: file.name.replace(/\.mp3$/i,''),
        artist: 'My Upload',
        genre: 'My Music',
        year: new Date().getFullYear(),
        url: blob.url,
        thumbnail: ''
      })
    });
    if(statusEl) statusEl.textContent = `✅ 저장 완료! 모든 사람이 들을 수 있어요`;
    return blob.url;
  }catch(e){
    console.error('Upload failed, fallback to local blob', e);
    if(statusEl) statusEl.textContent = '⚠️ 공유 저장소 미설정 - 로컬에서만 재생 (Vercel Blob 활성화 필요)';
    // fallback local
    return URL.createObjectURL(file);
  }
}

// Override file input handler if exists
document.addEventListener('DOMContentLoaded', () => {
  const fileInputs = document.querySelectorAll('input[type=file]');
  fileInputs.forEach(inp => {
    inp.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      if(file.type.startsWith('audio/') || file.name.endsWith('.mp3')){
        const sharedUrl = await uploadFileToSharedStorage(file);
        // Try to add to player queue
        if(window.addSongToQueue){
          window.addSongToQueue({title: file.name, url: sharedUrl, artist:'My Upload'});
        }
      }
    });
  });
});
</script>

<!-- MONETIZATION + LOGIN SYSTEM -->
<script>
// === AUTH SYSTEM ===
let currentUser = JSON.parse(localStorage.getItem('modio_user') || 'null');

async function register(email, password){
  const res = await fetch('/api/auth/register', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email,password})});
  const data = await res.json();
  if(!res.ok) throw new Error(data.error);
  localStorage.setItem('modio_user', JSON.stringify(data.user));
  localStorage.setItem('modio_token', data.token);
  currentUser = data.user;
  return data;
}
async function login(email, password){
  const res = await fetch('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email,password})});
  const data = await res.json();
  if(!res.ok) throw new Error(data.error);
  localStorage.setItem('modio_user', JSON.stringify(data.user));
  localStorage.setItem('modio_token', data.token);
  currentUser = data.user;
  return data;
}
function logout(){
  localStorage.removeItem('modio_user');
  localStorage.removeItem('modio_token');
  currentUser = null;
  location.reload();
}
function isLoggedIn(){ return !!currentUser; }
function getTier(){ return currentUser?.tier || 'free'; }

// === MONETIZATION CHECKS ===
function canUpload(){
  const tier = getTier();
  if(tier === 'beta' || tier === 'pro') return true;
  // free: 3개까지만
  const count = parseInt(localStorage.getItem('modio_upload_count')||'0');
  return count < 3;
}
function canPlayFull(){
  const tier = getTier();
  return tier === 'beta' || tier === 'pro';
}

// UI: Show login modal if not logged in for upload
const originalUpload = window.uploadFileToSharedStorage;
window.uploadFileToSharedStorage = async function(file){
  if(!isLoggedIn()){
    alert('로그인해야 업로드할 수 있어요! 상용화 수익화를 위해 로그인이 필수입니다.');
    document.getElementById('loginModal')?.classList.remove('hidden');
    return;
  }
  if(!canUpload()){
    alert('무료는 3개까지! Beta($4.99) 가입하면 무제한 업로드 가능');
    document.getElementById('paywallModal')?.classList.remove('hidden');
    return;
  }
  const url = await originalUpload(file);
  // increment count
  localStorage.setItem('modio_upload_count', (parseInt(localStorage.getItem('modio_upload_count')||'0')+1));
  return url;
}
</script>
