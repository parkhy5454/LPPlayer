<script>
window.LP_DEBUG = true;
async function debugLP(){
  try{
    const d = await fetch('/api/debug').then(r=>r.json());
    console.log('LP DEBUG', d);
    localStorage.setItem('lp_debug', JSON.stringify(d));
    return d;
  }catch(e){ console.error(e); return {error:e.message} }
}
</script>
