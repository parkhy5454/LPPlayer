<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LPPlayer">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap">
  <title>LPPlayer</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --fg: #f5f3ef;
      --surface: #141414;
      --surface-2: #1c1c1c;
      --border: #2a2a2a;
      --accent: #ffe600;
      --accent-2: #ff4d00;
      --muted: #8a8a8a;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --tap: 44px;
    }
    * { box-sizing: border-box; }
    /* Native-app shell: the page itself is pinned. Nothing bounces, drifts, pulls-to-refresh or zooms. */
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;          /* taps only; kills double-tap zoom */
      background: var(--bg);
      color: var(--fg);
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
      -webkit-touch-callout: none;         /* no iOS long-press callout */
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      font-family: "Space Grotesk", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
      font-size: 16px;            /* 16px+ prevents iOS zoom on focus */
      line-height: 1.4;
    }
    img, svg { -webkit-user-drag: none; user-drag: none; }
    /* only the library/upload/settings list scrolls, and only vertically */
    .views { touch-action: pan-y; }
    /* gesture areas: our own swipe handler decides, the browser does not pan */
    #stage, #player { touch-action: none; }
    input[type="range"] { touch-action: none; }
    input, button { font: inherit; color: inherit; }
    input[type="text"], input[type="search"] { user-select: text; -webkit-user-select: text; }
    button { cursor: pointer; touch-action: manipulation; }
    [hidden] { display: none !important; }

    /* ---------- app shell: 100dvh + safe areas ---------- */
    .app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      max-width: 480px;          /* phone-first; centered on wider screens */
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }
    .topbar {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(var(--safe-t) + 12px) 16px 8px;
    }
    .topbar h1 { margin: 0; font-size: 22px; letter-spacing: .02em; }
    .topbar .count { color: var(--muted); font-size: 16px; }

    .views {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;        /* no rubber-band past the list ends */
      -webkit-overflow-scrolling: touch;
      padding: 0 16px 16px;
    }
    .view { display: none; }
    .view.active { display: block; }

    /* ---------- vinyl ---------- */
    .stage { text-align: center; padding-top: 8px; }
    .vinyl {
      will-change: transform;          /* GPU layer: smooth spin on phones */
      transform: translateZ(0);
      width: min(62vw, 280px);
      height: min(62vw, 280px);
      margin: 0 auto 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle, #0a0a0a 0 16%, transparent 16.5%),
        repeating-radial-gradient(circle, #151515 0 2px, #1f1f1f 3px 4px);
      box-shadow: 0 0 0 6px #050505, 0 14px 32px rgba(0,0,0,.6);
    }
    .vinyl .label {
      width: 38%; aspect-ratio: 1; border-radius: 50%;
      background: var(--accent); color: #000;
      display: grid; place-items: center;
      font-weight: 700; font-size: 16px;
    }
    .vinyl.spin { animation: spin 1.8s linear infinite; }   /* 33 1/3 RPM = one turn every 1.8 s */
    .vinyl.paused { animation-play-state: paused; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .vinyl.spin { animation: none; } }
    .np-big { font-size: 20px; font-weight: 700; margin: 0 0 4px; overflow-wrap: anywhere; }
    .np-sub { color: var(--muted); margin: 0; }
    .lyrics { min-height: 84px; margin: 8px 8px 0; text-align: center; }
    .lyrics[hidden] { display: none; }
    .lyrics p { margin: 2px 0; line-height: 1.35; color: var(--muted); font-size: 16px; overflow-wrap: anywhere; }
    .lyrics .cur { color: var(--accent); font-size: 19px; font-weight: 700; }
    /* short phones: smaller disc so the three lyric lines fit above the player */
    @media (max-height: 760px) {
      .vinyl { width: min(46vw, 200px); height: min(46vw, 200px); margin-bottom: 8px; }
    }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 0 12px; scrollbar-width: none; }
    .chips[hidden] { display: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; min-height: var(--tap); padding: 0 16px; border-radius: 999px; border: 1px solid var(--muted); background: transparent; color: inherit; font-size: 16px; }
    .chip.on { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }
    .room-code { font-size: 44px; font-weight: 800; letter-spacing: .12em; text-align: center; margin: 4px 0 12px; }
    .avatars { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px; }
    .avatar { width: var(--tap); height: var(--tap); border-radius: 50%; background: var(--accent); color: #000; display: grid; place-items: center; font-weight: 800; }
    .reacts { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
    .react-btn { min-width: var(--tap); min-height: var(--tap); border-radius: 50%; border: 1px solid var(--muted); background: transparent; font-size: 22px; }
    #roomPanel .btn { margin-top: 10px; }
    .float-layer { position: fixed; left: 0; right: 0; bottom: 200px; height: 0; pointer-events: none; }
    .float-emoji { position: absolute; bottom: 0; font-size: 34px; animation: floatUp 1.5s ease-out forwards; }
    @keyframes floatUp { to { transform: translateY(-180px); opacity: 0; } }
    .field { display: block; width: 100%; box-sizing: border-box; min-height: var(--tap); margin: 10px 0 0; padding: 0 14px; border-radius: 12px; border: 1px solid var(--muted); background: transparent; color: inherit; font-size: 16px; }
    body.privacy .t, body.privacy .a, body.privacy .np-title, body.privacy .np-artist,
    body.privacy .np-big, body.privacy .np-sub, body.privacy .lyrics { filter: blur(6px); user-select: none; }

    /* ---------- player bar (one-hand zone) ---------- */
    .player {
      flex: none;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 16px 8px;
    }
    .np-row { display: flex; flex-direction: column; min-width: 0; margin-bottom: 4px; }
    .np-title { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .np-artist { font-size: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .seek-wrap { display: flex; align-items: center; gap: 8px; min-height: var(--tap); }
    .time { font-size: 16px; color: var(--muted); min-width: 3.2em; text-align: center; font-variant-numeric: tabular-nums; }
    input[type="range"] {
      flex: 1; height: var(--tap); margin: 0; background: transparent;
      -webkit-appearance: none; appearance: none;
    }
    input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: var(--border); border-radius: 2px; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 20px; height: 20px; margin-top: -8px;
      border-radius: 50%; background: var(--accent); border: 0;
    }
    input[type="range"]::-moz-range-track { height: 4px; background: var(--border); border-radius: 2px; }
    input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); border: 0; }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto 1fr;   /* play button sits dead-centre, thumb-reachable */
      align-items: center;
      justify-items: center;
      padding-top: 4px;
    }
    .controls .side { justify-self: stretch; display: flex; }
    .controls .side.left { justify-content: flex-start; }
    .controls .side.right { justify-content: flex-end; }
    .icon-btn {
      min-width: var(--tap); min-height: var(--tap);
      border: 0; border-radius: 12px; background: transparent; color: var(--fg);
      display: grid; place-items: center; padding: 0;
      transition: transform .08s ease;
    }
    .btn-play {
      width: 68px; height: 68px; border-radius: 50%; border: 0;
      background: var(--accent); color: #000;
      display: grid; place-items: center; padding: 0;
      box-shadow: 0 6px 18px rgba(255,230,0,.25);
      transition: transform .08s ease;
    }
    .icon-btn:active, .btn-play:active, .tab:active, .row:active, .btn:active, .del:active, .lang-btn:active {
      transform: scale(0.95);
    }
    /* every button gives the same press feedback */
    button:active:not(:disabled) { transform: scale(0.95); }
    .icon-btn svg, .btn-play svg, .tab svg { width: 26px; height: 26px; fill: currentColor; }
    .tab svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ---------- bottom tab bar ---------- */
    .tabbar {
      flex: none;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: var(--bg);
      padding-bottom: var(--safe-b);
      border-top: 1px solid var(--border);
    }
    .tab {
      min-height: 60px; border: 0; background: transparent; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      font-size: 16px; padding: 6px 0;
      transition: transform .08s ease;
    }
    .tab.on { color: var(--accent); }

    /* ---------- library ---------- */
    .list { display: flex; flex-direction: column; gap: 8px; }
    .row {
      display: flex; align-items: center; gap: 4px;
      background: var(--surface); border-radius: 14px;
      min-height: 60px; transition: transform .08s ease;
    }
    .row.playing { box-shadow: inset 0 0 0 2px var(--accent); }
    .row-main {
      flex: 1; min-width: 0; min-height: 60px; display: flex; align-items: center; gap: 12px;
      background: transparent; border: 0; text-align: left; padding: 8px 4px 8px 12px;
    }
    .row-idx { width: 24px; color: var(--muted); text-align: center; flex: none; }
    .row.playing .row-idx { color: var(--accent); }
    .meta { display: flex; flex-direction: column; min-width: 0; }
    .meta .t { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta .a { font-size: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .del {
      flex: none; min-width: var(--tap); min-height: var(--tap);
      border: 0; background: transparent; color: var(--muted); border-radius: 12px;
      margin-right: 4px; transition: transform .08s ease;
    }
    .empty { color: var(--muted); text-align: center; padding: 40px 8px; }

    /* ---------- upload ---------- */
    .btn {
      min-height: 56px; width: 100%; border: 0; border-radius: 16px;
      background: var(--accent); color: #000; font-weight: 700; font-size: 17px;
      padding: 0 16px; transition: transform .08s ease;
    }
    .btn:disabled { opacity: .5; }
    .card { background: var(--surface); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .card h2 { font-size: 18px; margin: 0 0 8px; }
    .log { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .log li { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; font-size: 16px; }
    .log .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .log .s { flex: 0 1 auto; min-width: 0; color: var(--muted); overflow-wrap: anywhere; text-align: right; }
    .log .ok .s { color: var(--accent); }
    .log .err .s { color: var(--accent-2); }
    .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; opacity: 0;
    }

    /* ---------- settings ---------- */
    .lang-group { display: flex; gap: 8px; }
    .lang-btn {
      flex: 1; min-height: var(--tap); border: 0; border-radius: 12px;
      background: var(--surface-2); color: var(--fg); font-weight: 600;
      transition: transform .08s ease;
    }
    .lang-btn[aria-pressed="true"] { background: var(--accent); color: #000; }

    /* ---------- password gate ---------- */
    .lock {
      position: fixed; inset: 0; z-index: 50;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      padding: calc(var(--safe-t) + 24px) 24px calc(var(--safe-b) + 24px);
    }
    .lock-card { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
    .lock-card h2 { margin: 0; font-size: 26px; }
    .lock-card p { margin: 0; color: var(--muted); }
    .lock-card input {
      min-height: 56px; font-size: 16px; border-radius: 14px; padding: 0 16px;
      border: 1px solid var(--border); background: var(--surface); color: var(--fg);
      user-select: text; -webkit-user-select: text;
    }
    .lock-card .err { color: var(--accent-2); }

    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .seg-btn {
      min-height: var(--tap); border: 0; border-radius: 12px;
      background: var(--surface-2); color: var(--fg); font-weight: 600;
      transition: transform .08s ease;
    }
    .seg-btn.on { background: var(--accent); color: #000; }
    .btn-secondary { background: var(--surface-2); color: var(--fg); font-weight: 600; }
    .account-email { color: var(--muted); margin: 0 0 12px; overflow-wrap: anywhere; }

    /* ---------- toast ---------- */
    .toast {
      position: absolute; left: 16px; right: 16px;
      top: calc(var(--safe-t) + 64px);
      background: var(--surface-2); color: var(--fg);
      border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; font-size: 16px; z-index: 10;
      opacity: 0; transform: translateY(-8px); pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: none; }

    /* ---------- portrait only: landscape phones get a rotate prompt ---------- */
    .rotate-lock {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: var(--bg); color: var(--fg);
      align-items: center; justify-content: center; text-align: center;
      font-size: 18px; padding: 24px;
    }
    @media (orientation: landscape) and (max-height: 500px) {
      .app { display: none; }
      .rotate-lock { display: flex; }
    }

    /* press feedback on every control, native-style */
    button { -webkit-tap-highlight-color: transparent; }
    button:focus:not(:focus-visible) { outline: none; }
    .row-main, .tab, .icon-btn, .btn-play, .btn, .del, .lang-btn { transition: transform .08s ease; }

    /* ---------- larger phones: keep same layout, a bit more room ---------- */
    @media (min-width: 390px) {
      .btn-play { width: 72px; height: 72px; }
    }
  </style>
</head>
<body>
  <div class="rotate-lock" data-i18n="rotate">세로 모드로 돌려주세요</div>

  <div class="app" id="app">
    <header class="topbar">
      <h1>LPPlayer</h1>
      <span class="count" id="count"></span>
    </header>

    <main class="views" id="main">
      <!-- HOME -->
      <section class="view active" id="view-home" aria-label="home">
        <div class="stage" id="stage">
          <div class="vinyl paused" id="vinyl"><div class="label">LP</div></div>
          <p class="np-big" id="bigTitle">—</p>
          <p class="np-sub" id="bigArtist"></p>
          <div class="lyrics" id="lyrics" hidden>
            <p id="lyPrev"></p>
            <p class="cur" id="lyCur"></p>
            <p id="lyNext"></p>
          </div>
        </div>
      </section>

      <!-- LIBRARY -->
      <section class="view" id="view-library" aria-label="library">
        <input class="field" id="searchInput" type="search" data-i18n-ph="searchPh" placeholder="검색 (제목, 아티스트)">
        <div class="chips" id="yearChips" hidden></div>
        <div class="list" id="list"></div>
      </section>

      <!-- UPLOAD -->
      <section class="view" id="view-upload" aria-label="upload">
        <div class="card">
          <h2 data-i18n="uploadTitle">파일 업로드</h2>
          <input class="field" id="titleInput" type="text" maxlength="80"
                 data-i18n-ph="titlePh" placeholder="제목 (선택, 한 곡일 때)">
          <input class="field" id="artistInput" type="text" maxlength="80"
                 data-i18n-ph="artistPh" placeholder="아티스트 (선택)">
          <input class="field" id="yearInput" type="number" inputmode="numeric" min="1900" max="2100"
                 data-i18n-ph="yearPh" placeholder="연도 (선택)">
          <button class="btn" id="pickBtn" type="button" data-i18n="pickFiles">파일 선택 (여러 개 가능)</button>
          <input class="sr-only" id="fileInput" type="file" multiple
                 accept="audio/*,video/*,.mp3,.m4a,.wav,.flac,.aac,.ogg,.opus,.mp4,.lrc">
          <ul class="log" id="uploadLog"></ul>
        </div>
      </section>

      <!-- TOGETHER: one host controls playback, members follow -->
      <section class="view" id="view-together" aria-label="together">
        <div class="card" id="roomEntry">
          <button class="btn" id="makeRoomBtn" type="button" data-i18n="makeRoom">방 만들기</button>
          <input class="field" id="joinCode" type="text" inputmode="numeric" maxlength="6" autocomplete="off"
                 data-i18n-ph="codePh" placeholder="6자리 코드">
          <button class="btn btn-secondary" id="joinBtn" type="button" data-i18n="join">참가</button>
        </div>
        <div class="card" id="roomPanel" hidden>
          <p class="room-code" id="roomCode"></p>
          <div class="avatars" id="members"></div>
          <div class="reacts" id="reacts"></div>
          <button class="btn btn-secondary" id="shareBtn" type="button" data-i18n="share">코드 공유</button>
          <div id="hostBox" hidden>
            <h2 data-i18n="queueTitle">내 곡</h2>
            <div class="list" id="hostSongs"></div>
          </div>
          <h2 data-i18n="queueNext">다음 곡</h2>
          <ul class="log" id="roomQueue"></ul>
          <button class="btn btn-secondary" id="leaveBtn" type="button" data-i18n="leaveRoom">방 나가기</button>
        </div>
        <div class="float-layer" id="floatLayer"></div>
      </section>

      <!-- SETTINGS -->
      <section class="view" id="view-settings" aria-label="settings">
        <div class="card">
          <h2 data-i18n="language">언어</h2>
          <div class="lang-group">
            <button class="lang-btn" type="button" data-lang="ko" aria-pressed="false">한국어</button>
            <button class="lang-btn" type="button" data-lang="en" aria-pressed="false">English</button>
          </div>
        </div>
        <div class="card">
          <h2 data-i18n="account">계정</h2>
          <p class="account-email" id="accountEmail"></p>
          <button class="btn btn-secondary" id="logoutBtn" type="button" data-i18n="logout">로그아웃</button>
        </div>
        <div class="card">
          <h2 data-i18n="privacyTitle">개인정보 보호 모드</h2>
          <button class="btn btn-secondary" id="privacyBtn" type="button"></button>
        </div>
        <div class="card">
          <h2 data-i18n="install">홈 화면에 설치</h2>
          <button class="btn" id="installBtn" type="button" hidden data-i18n="installBtn">설치</button>
          <p id="iosHint" hidden data-i18n="iosHint">Safari 하단의 공유 버튼 → "홈 화면에 추가"를 누르세요.</p>
          <p id="installedMsg" hidden data-i18n="installed">이미 설치되어 있습니다</p>
        </div>
      </section>
    </main>

    <!-- PLAYER: swipe anywhere here for prev / next -->
    <div class="player" id="player">
      <div class="np-row">
        <span class="np-title" id="npTitle">—</span>
        <span class="np-artist" id="npArtist"></span>
      </div>
      <div class="seek-wrap">
        <span class="time" id="tCur">0:00</span>
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="seek">
        <span class="time" id="tDur">0:00</span>
      </div>
      <div class="controls">
        <div class="side left">
          <button class="icon-btn" id="prevBtn" type="button" aria-label="prev">
            <svg viewBox="0 0 24 24"><rect x="5" y="5" width="2.6" height="14" rx="1"/><polygon points="19,5 8.5,12 19,19"/></svg>
          </button>
        </div>
        <button class="btn-play" id="playBtn" type="button" aria-label="play">
          <svg viewBox="0 0 24 24" id="playIcon"><polygon points="8,5 19,12 8,19"/></svg>
        </button>
        <div class="side right">
          <button class="icon-btn" id="nextBtn" type="button" aria-label="next">
            <svg viewBox="0 0 24 24"><rect x="16.4" y="5" width="2.6" height="14" rx="1"/><polygon points="5,5 15.5,12 5,19"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- BOTTOM TABS (the only navigation; no hamburger) -->
    <nav class="tabbar" aria-label="main">
      <button class="tab on" type="button" data-view="home" aria-current="page">
        <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v8a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/></svg>
        <span data-i18n="tabHome">홈</span>
      </button>
      <button class="tab" type="button" data-view="library" aria-current="false">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span data-i18n="tabLib">보관함</span>
      </button>
      <button class="tab" type="button" data-view="upload" aria-current="false">
        <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>
        <span data-i18n="tabUpload">업로드</span>
      </button>
      <button class="tab" type="button" data-view="together" aria-current="false">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3 2.7-5 6-5s6 2 6 5M14.5 15.2c2.6.1 5.5 1.6 5.5 4.8"/></svg>
        <span data-i18n="tabTogether">함께</span>
      </button>
      <button class="tab" type="button" data-view="settings" aria-current="false">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
        <span data-i18n="tabSettings">설정</span>
      </button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <div class="lock" id="lock" hidden>
    <form class="lock-card" id="lockForm" autocomplete="on">
      <h2>LPPlayer</h2>
      <div class="seg">
        <button class="seg-btn on" type="button" data-mode="login" data-i18n="tabLogin">로그인</button>
        <button class="seg-btn" type="button" data-mode="signup" data-i18n="tabSignup">회원가입</button>
      </div>
      <input type="email" id="authEmail" name="email" autocomplete="email" inputmode="email"
             autocapitalize="off" autocorrect="off" spellcheck="false" data-i18n-ph="emailPh" placeholder="이메일" required>
      <input type="password" id="authPw" name="password" autocomplete="current-password"
             data-i18n-ph="passwordPh" placeholder="비밀번호 (8자 이상)" required>
      <p class="err" id="lockErr" hidden></p>
      <button class="btn" type="submit" id="authSubmit">로그인</button>
    </form>
  </div>

  <audio id="audio" preload="metadata" playsinline></audio>
  <!-- direct-to-Blob upload client, bundled from @vercel/blob (see README) -->

  <script>
  (() => {
    'use strict';

    /* ---------------- i18n ---------------- */
    const I18N = {
      ko: {
        tabHome: '홈', tabLib: '보관함', tabUpload: '업로드', tabSettings: '내 정보', searchPh: '검색 (제목, 아티스트)',
        uploadTitle: '파일 업로드',
        tabLogin: '로그인', tabSignup: '회원가입', emailPh: '이메일', passwordPh: '비밀번호 (8자 이상)',
        account: '계정', logout: '로그아웃', sessionEnded: '다시 로그인해 주세요',
        nothing: '재생 중인 곡 없음',
        noSongs: '아직 곡이 없습니다. 업로드 탭에서 파일을 추가하세요.',
        loadFail: '곡 목록을 불러오지 못했습니다',
        artistUnknown: '알 수 없음',
        prev: '이전', next: '다음', play: '재생', pause: '일시정지', delete: '삭제',
        delConfirm: '이 곡을 목록에서 삭제할까요?',
        pickFiles: '파일 선택 (여러 개 가능)',
        uploading: '업로드 중…', saving: '저장 중…', timeout: '응답이 없습니다 (시간 초과)', done: '완료', badType: '오디오 파일이 아닙니다',
        uploadProgress: (n, t) => `${n} / ${t} 업로드 중`,
        uploadOk: (n) => `${n}곡 업로드 되었습니다 - 영구 저장됨`,
        titlePh: '제목 (선택, 한 곡일 때)', artistPh: '아티스트 (선택)',
        uploadFail: '업로드 실패',
        language: '언어', install: '홈 화면에 설치', installBtn: '설치',
        installed: '이미 설치되어 있습니다',
        iosHint: 'Safari 하단의 공유 버튼 → "홈 화면에 추가"를 누르세요.',
        rotate: '세로 모드로 돌려주세요',
        playFail: '재생할 수 없는 파일입니다',
        tooBig: '500MB를 넘는 파일입니다',
        yearPh: '연도 (선택)', yearAll: '전체', privacyTitle: '개인정보 보호 모드', privacyOn: '켜짐', privacyOff: '꺼짐',
        tabTogether: '함께', makeRoom: '방 만들기', join: '참가', codePh: '6자리 코드', codeBad: '6자리 숫자 코드를 입력하세요',
        share: '코드 공유', copied: '코드를 복사했습니다', shareText: 'LPPlayer 함께 듣기 코드', leaveRoom: '방 나가기',
        roomEnded: '방이 종료되었습니다', hostOnly: '방장만 조작할 수 있습니다', queueAdd: '다음 곡에 추가',
        queueTitle: '내 곡', queueNext: '다음 곡', tapToPlay: '화면을 눌러 재생을 시작하세요'
      },
      en: {
        tabHome: 'Home', tabLib: 'Library', tabUpload: 'Upload', tabSettings: 'Me', searchPh: 'Search (title, artist)',
        uploadTitle: 'Upload files',
        tabLogin: 'Log in', tabSignup: 'Sign up', emailPh: 'Email', passwordPh: 'Password (8+ characters)',
        account: 'Account', logout: 'Log out', sessionEnded: 'Please log in again',
        nothing: 'Nothing playing',
        noSongs: 'No tracks yet. Add files in the Upload tab.',
        loadFail: 'Could not load your library',
        artistUnknown: 'Unknown',
        prev: 'Previous', next: 'Next', play: 'Play', pause: 'Pause', delete: 'Delete',
        delConfirm: 'Remove this track from the library?',
        pickFiles: 'Choose files (multiple allowed)',
        uploading: 'Uploading…', saving: 'Saving…', timeout: 'No response (timed out)', done: 'Done', badType: 'Not an audio file',
        uploadProgress: (n, t) => `Uploading ${n} / ${t}`,
        uploadOk: (n) => `${n} track(s) uploaded - saved permanently`,
        titlePh: 'Title (optional, single track)', artistPh: 'Artist (optional)',
        uploadFail: 'Upload failed',
        language: 'Language', install: 'Add to Home Screen', installBtn: 'Install',
        installed: 'Already installed',
        iosHint: 'Tap the Share button in Safari, then "Add to Home Screen".',
        rotate: 'Please rotate to portrait',
        playFail: 'This file cannot be played',
        tooBig: 'File is larger than 500 MB',
        yearPh: 'Year (optional)', yearAll: 'All', privacyTitle: 'Privacy mode', privacyOn: 'On', privacyOff: 'Off',
        tabTogether: 'Together', makeRoom: 'Create room', join: 'Join', codePh: '6-digit code', codeBad: 'Enter the 6-digit number code',
        share: 'Share code', copied: 'Code copied', shareText: 'Listen together on LPPlayer, code', leaveRoom: 'Leave room',
        roomEnded: 'The room has ended', hostOnly: 'Only the host can control playback', queueAdd: 'Add to next',
        queueTitle: 'My tracks', queueNext: 'Up next', tapToPlay: 'Tap the screen to start playing'
      }
    };

    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch {} }
    };
    let lang = store.get('lp_lang') === 'en' ? 'en' : 'ko';
    const T = (k, ...a) => {
      const v = (I18N[lang] && I18N[lang][k]) ?? I18N.ko[k] ?? k;
      return typeof v === 'function' ? v(...a) : v;
    };

    /* ---------------- helpers ---------------- */
    const $ = (s) => document.querySelector(s);
    const audio = $('#audio');
    let songs = [];       // from GET /api/songs (newest first)
    let idx = -1;         // index of the current track in `songs`

    function el(tag, attrs = {}, ...children) {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
      for (const c of children) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
      return n;
    }
    const TOKEN_NAME = 'lp_token', EMAIL_NAME = 'lp_email';
    const getToken = () => store.get(TOKEN_NAME) || '';
    let authMode = 'login';
    function showAuth(message) {
      $('#lockErr').textContent = message || '';
      $('#lockErr').hidden = !message;
      $('#lock').hidden = false;
      setTimeout(() => $('#authEmail').focus(), 50);
    }
    function setAuthMode(m) {
      authMode = m;
      document.querySelectorAll('.seg-btn').forEach((b) => b.classList.toggle('on', b.dataset.mode === m));
      $('#authSubmit').textContent = T(m === 'login' ? 'tabLogin' : 'tabSignup');
      $('#authPw').setAttribute('autocomplete', m === 'login' ? 'current-password' : 'new-password');
    }
    function renderAccount() { $('#accountEmail').textContent = store.get(EMAIL_NAME) || ''; }
    function endSession(message) {
      store.set(TOKEN_NAME, '');
      store.set(EMAIL_NAME, '');
      songs = [];
      idx = -1;
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
      renderLibrary();
      updatePlayer();
      renderAccount();
      showAuth(message);
    }
    async function api(path, opts = {}) {
      const headers = { ...(opts.headers || {}) };
      const token = getToken();
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 30000);
      let r;
      try {
        r = await fetch(path, { ...opts, headers, signal: ctl.signal });
      } catch (e) {
        throw new Error(e.name === 'AbortError' ? T('timeout') : e.message);
      } finally {
        clearTimeout(timer);
      }
      const data = await r.json().catch(() => ({}));
      if (r.status === 401) {
        endSession(T('sessionEnded'));
        throw new Error('unauthorized');
      }
      if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
      return data;
    }
    function fmt(sec) {
      if (!isFinite(sec) || sec < 0) return '0:00';
      const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
      return `${m}:${String(s).padStart(2, '0')}`;
    }
    let toastTimer;
    function toast(msg) {
      const n = $('#toast');
      n.textContent = msg;
      n.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => n.classList.remove('show'), 3000);
    }

    /* ---------------- library ---------------- */
    async function loadSongs() {
      try {
        const d = await api('/api/songs');
        songs = d.songs || [];
        if (idx >= songs.length) idx = -1;
      } catch (e) {
        if (e.message !== 'unauthorized') toast(`${T('loadFail')}: ${e.message}`);
      }
      renderLibrary();
      updatePlayer();
    }

    function renderLibrary() {
      renderYearChips();
      const list = $('#list');
      $('#count').textContent = songs.length ? `${songs.length}` : '';
      list.textContent = '';
      if (!songs.length) {
        list.append(el('p', { class: 'empty' }, T('noSongs')));
        return;
      }
      songs.forEach((s, i) => {
        if (yearFilter && String(s.year || '') !== yearFilter) return;
        const q = $('#searchInput').value.trim().toLowerCase();
        if (q && !`${s.title || ''} ${s.artist || ''}`.toLowerCase().includes(q)) return;
        const sub = [s.artist || T('artistUnknown'), s.year].filter(Boolean).join(' · ');
        const main = el('button', { class: 'row-main', type: 'button' },
          el('span', { class: 'row-idx' }, i === idx ? '♪' : String(i + 1)),
          el('span', { class: 'meta' },
            el('span', { class: 't' }, s.title || 'Untitled'),
            el('span', { class: 'a' }, sub)));
        main.addEventListener('click', () => playIndex(i));
        const del = el('button', { class: 'del', type: 'button', 'aria-label': T('delete') }, '✕');
        del.addEventListener('click', () => removeSong(s.id));
        list.append(el('div', { class: 'row' + (i === idx ? ' playing' : '') }, main, del));
      });
    }

    async function removeSong(id) {
      if (!confirm(T('delConfirm'))) return;
      const i = songs.findIndex((s) => s.id === id);
      if (i < 0) return;
      try {
        await api(`/api/songs?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
      } catch (e) {
        toast(e.message);
        return;
      }
      songs.splice(i, 1);
      if (i === idx) {
        audio.pause();
        audio.removeAttribute('src');
        audio.load();
        idx = -1;
        setLyrics(null);
      } else if (i < idx) {
        idx--;
      }
      renderLibrary();
      updatePlayer();
    }

    /* ---------------- lyrics (LRC: [mm:ss.xx] text) ---------------- */
    let lyLines = [];
    let lyIdx = -2;
    function parseLrc(text) {
      const out = [];
      if (!text) return out;
      for (const raw of String(text).split(/\r?\n/)) {
        const stamps = [...raw.matchAll(/\[(\d{1,3}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g)];
        if (!stamps.length) continue;
        const words = raw.replace(/\[[^\]]*\]/g, '').trim();
        for (const m of stamps) {
          const frac = m[3] ? Number('0.' + m[3]) : 0;
          out.push({ t: Number(m[1]) * 60 + Number(m[2]) + frac, text: words });
        }
      }
      return out.sort((a, b) => a.t - b.t);
    }
    function setLyrics(s) {
      lyLines = parseLrc(s && s.lyrics);
      lyIdx = -2;
      $('#lyrics').hidden = !lyLines.length;
      updateLyrics();
    }
    function updateLyrics() {
      if (!lyLines.length) return;
      const t = audio.currentTime;
      let i = -1;
      for (let k = 0; k < lyLines.length && lyLines[k].t <= t; k++) i = k;
      if (i === lyIdx) return;
      lyIdx = i;
      $('#lyPrev').textContent = i > 0 ? lyLines[i - 1].text : '';
      $('#lyCur').textContent = i >= 0 ? lyLines[i].text : '';
      $('#lyNext').textContent = i + 1 < lyLines.length ? lyLines[i + 1].text : '';
    }

    /* ---------------- year filter (Time Capsule) ---------------- */
    let yearFilter = '';
    function renderYearChips() {
      const box = $('#yearChips');
      const years = [...new Set(songs.map((s) => s.year).filter(Boolean))].sort((a, b) => b - a);
      box.textContent = '';
      box.hidden = years.length === 0;
      for (const y of ['', ...years]) {
        const b = el('button', { class: 'chip' + (yearFilter === String(y) ? ' on' : ''), type: 'button' },
          y === '' ? T('yearAll') : String(y));
        b.addEventListener('click', () => { yearFilter = String(y); renderLibrary(); });
        box.append(b);
      }
    }

    /* ---------------- privacy mode (blurs titles on this device) ---------------- */
    function applyPrivacy() {
      const on = store.get('lp_privacy') === '1';
      document.body.classList.toggle('privacy', on);
      $('#privacyBtn').textContent = on ? T('privacyOn') : T('privacyOff');
    }
    $('#privacyBtn').addEventListener('click', () => {
      store.set('lp_privacy', store.get('lp_privacy') === '1' ? '0' : '1');
      applyPrivacy();
    });

    /* ---------------- together (Mixtape): one host, members follow ---------------- */
    const REACTIONS_LIST = ['❤️', '🔥', '😭', '👏'];
    let room = null;          // {code, isHost} while in a room
    let roomTimer = null;
    let roomSongId = null;
    let roomSongInfo = null;  // the room's current track, shown in the player
    let lastReactionId = 0;

    function roomGuard() {
      if (room && !room.isHost) { toast(T('hostOnly')); return true; }
      return false;
    }
    async function roomControl(action, extra = {}) {
      if (!room) return;
      try {
        await api('/api/rooms?action=control', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: room.code, action, ...extra })
        });
        syncRoom();
      } catch (e) { toast(e.message); }
    }
    function enterRoom(code, isHost) {
      room = { code, isHost };
      roomSongId = null;
      roomSongInfo = null;
      lastReactionId = 0;
      $('#roomEntry').hidden = true;
      $('#roomPanel').hidden = false;
      $('#roomCode').textContent = code;
      $('#hostBox').hidden = !isHost;
      renderHostSongs();
      clearInterval(roomTimer);
      roomTimer = setInterval(syncRoom, 2000);
      syncRoom();
    }
    function exitRoom(message) {
      if (room) {
        api('/api/rooms?action=leave', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: room.code }) }).catch(() => {});
      }
      clearInterval(roomTimer);
      room = null;
      roomSongId = null;
      roomSongInfo = null;
      $('#roomEntry').hidden = false;
      $('#roomPanel').hidden = true;
      audio.pause();
      updatePlayer();
      if (message) toast(message);
    }
    function renderHostSongs() {
      const box = $('#hostSongs');
      box.textContent = '';
      if (!room || !room.isHost) return;
      if (!songs.length) { box.append(el('p', { class: 'empty' }, T('noSongs'))); return; }
      songs.forEach((s) => {
        const main = el('button', { class: 'row-main', type: 'button', 'aria-label': s.title || '' },
          el('span', { class: 'meta' },
            el('span', { class: 't' }, s.title || 'Untitled'),
            el('span', { class: 'a' }, s.artist || T('artistUnknown'))));
        main.addEventListener('click', () => roomControl('song', { songId: s.id }));
        const add = el('button', { class: 'del', type: 'button', 'aria-label': T('queueAdd') }, '+');
        add.addEventListener('click', () => roomControl('queue', { songId: s.id }));
        box.append(el('div', { class: 'row' }, main, add));
      });
    }
    function renderRoomPeople(st) {
      const box = $('#members');
      box.textContent = '';
      st.members.forEach((email) => box.append(el('span', { class: 'avatar' }, (email[0] || '?').toUpperCase())));
    }
    function renderRoomQueue(queue) {
      const ul = $('#roomQueue');
      ul.textContent = '';
      queue.forEach((q) => ul.append(el('li', {},
        el('span', { class: 'n' }, q.title || 'Untitled'),
        el('span', { class: 's' }, q.artist || ''))));
    }
    function showReactions(list) {
      for (const r of list) {
        if (r.id <= lastReactionId) continue;
        lastReactionId = r.id;
        const f = el('span', { class: 'float-emoji' }, r.emoji);
        f.style.left = (15 + Math.random() * 70) + '%';
        $('#floatLayer').append(f);
        setTimeout(() => f.remove(), 1600);
      }
    }
    async function roomReact(emoji) {
      if (!room) return;
      try {
        await api('/api/rooms?action=react', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: room.code, emoji }) });
        syncRoom();
      } catch (e) { toast(e.message); }
    }
    // poll the room every 2 s; the audio follows the server clock (updatedAt / serverNow)
    async function syncRoom() {
      if (!room) return;
      let st;
      try {
        st = await api(`/api/rooms?action=state&code=${encodeURIComponent(room.code)}`);
      } catch (e) {
        if (room && /not found|ended/.test(e.message)) exitRoom(T('roomEnded'));
        return;
      }
      if (!room) return;
      if (st.isHost !== room.isHost) {
        room.isHost = st.isHost;
        $('#hostBox').hidden = !room.isHost;
        renderHostSongs();
      }
      renderRoomPeople(st);
      renderRoomQueue(st.queue);
      showReactions(st.reactions);
      if (!st.song) { roomSongInfo = null; updatePlayer(); return; }
      if (roomSongId !== st.song.id) {
        roomSongId = st.song.id;
        roomSongInfo = st.song;
        audio.src = st.song.url;
        setLyrics(st.song);
        updatePlayer();
      }
      if (audio.readyState < 1) return;   // metadata not loaded yet; loadedmetadata triggers another sync
      const expected = st.position + (st.playing ? Math.max(0, (Date.parse(st.serverNow) - Date.parse(st.updatedAt)) / 1000) : 0);
      if (st.playing) {
        if (Math.abs(audio.currentTime - expected) > 1) audio.currentTime = expected;
        if (audio.paused) playAudio();
      } else {
        if (!audio.paused) audio.pause();
        if (Math.abs(audio.currentTime - st.position) > 0.3) audio.currentTime = st.position;
      }
    }

    $('#makeRoomBtn').addEventListener('click', async () => {
      try {
        const d = await api('/api/rooms?action=create', { method: 'POST' });
        enterRoom(d.code, true);
      } catch (e) { toast(e.message); }
    });
    $('#joinBtn').addEventListener('click', async () => {
      const code = $('#joinCode').value.trim();
      if (!/^\d{6}$/.test(code)) return toast(T('codeBad'));
      try {
        await api('/api/rooms?action=join', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }) });
        enterRoom(code, false);
      } catch (e) { toast(e.message); }
    });
    $('#leaveBtn').addEventListener('click', () => exitRoom(''));
    $('#shareBtn').addEventListener('click', async () => {
      if (!room) return;
      try {
        if (navigator.share) await navigator.share({ title: 'LPPlayer', text: `${T('shareText')} ${room.code}` });
        else { await navigator.clipboard.writeText(room.code); toast(T('copied')); }
      } catch {}
    });
    REACTIONS_LIST.forEach((e) => {
      const b = el('button', { class: 'react-btn', type: 'button', 'aria-label': e }, e);
      b.addEventListener('click', () => roomReact(e));
      $('#reacts').append(b);
    });

    /* ---------------- playback ---------------- */
    function playIndex(i) {
      if (!songs.length) return;
      idx = ((i % songs.length) + songs.length) % songs.length;
      const s = songs[idx];
      audio.src = s.url;
      setLyrics(s);
      playAudio();
      if ('mediaSession' in navigator) {
        try { navigator.mediaSession.metadata = new MediaMetadata({ title: s.title || '', artist: s.artist || '' }); } catch {}
      }
      renderLibrary();
      updatePlayer();
    }
    function playAudio() {
      const p = audio.play();
      if (p && p.catch) p.catch((e) => {
        // AbortError = a newer track replaced this one; that is not a failure
        if (e && e.name === 'NotAllowedError' && room) toast(T('tapToPlay'));
        else if (e && e.name !== 'AbortError') toast(T('playFail'));
      });
    }
    function togglePlay() {
      if (roomGuard()) return;
      if (room) return roomControl(audio.paused ? 'play' : 'pause', { position: audio.currentTime });
      if (idx < 0) return playIndex(0);
      if (audio.paused) playAudio(); else audio.pause();
    }
    function next() {
      if (roomGuard()) return;
      if (room) return roomControl('next');
      playIndex(idx + 1);
    }
    function prev() {
      if (roomGuard()) return;
      if (room) return roomControl('seek', { position: 0 });
      if (audio.currentTime > 3) { audio.currentTime = 0; return; }   // like real players
      playIndex(idx - 1);
    }

    const PLAY_SVG = '<polygon points="8,5 19,12 8,19"/>';
    const PAUSE_SVG = '<rect x="6" y="5" width="4.2" height="14" rx="1"/><rect x="13.8" y="5" width="4.2" height="14" rx="1"/>';

    function updatePlayer() {
      const s = room ? roomSongInfo : songs[idx];
      const title = s ? (s.title || 'Untitled') : T('nothing');
      const artist = s ? (s.artist || T('artistUnknown')) : '';
      $('#npTitle').textContent = title;
      $('#npArtist').textContent = artist;
      $('#bigTitle').textContent = title;
      $('#bigArtist').textContent = artist;
      const playing = !!s && !audio.paused;
      $('#playIcon').innerHTML = playing ? PAUSE_SVG : PLAY_SVG;
      $('#playBtn').setAttribute('aria-label', playing ? T('pause') : T('play'));
      $('#vinyl').classList.toggle('spin', playing);
      $('#vinyl').classList.toggle('paused', !playing);
      $('#prevBtn').setAttribute('aria-label', T('prev'));
      $('#nextBtn').setAttribute('aria-label', T('next'));
      $('#prevBtn').disabled = !room && !songs.length;
      $('#nextBtn').disabled = !room && !songs.length;
    }

    // needle drop: a short synthesized crackle when a record starts from the beginning
    let needleCtx = null;
    function needleDrop() {
      try {
        needleCtx = needleCtx || new (window.AudioContext || window.webkitAudioContext)();
        const sr = needleCtx.sampleRate;
        const buf = needleCtx.createBuffer(1, Math.floor(sr * 0.25), sr);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sr * 0.04)) * 0.25;
        const src = needleCtx.createBufferSource();
        src.buffer = buf;
        src.connect(needleCtx.destination);
        src.start();
      } catch {}
    }
    audio.addEventListener('play', () => {
      if (audio.currentTime < 0.6) needleDrop();
      updatePlayer();
    });
    audio.addEventListener('pause', updatePlayer);
    audio.addEventListener('ended', () => {
      if (room) { if (room.isHost) roomControl('next'); return; }   // in a room only the host advances
      next();
    });
    audio.addEventListener('loadedmetadata', () => {
      $('#tDur').textContent = fmt(audio.duration);
      if (room) syncRoom();
    });
    audio.addEventListener('timeupdate', () => {
      $('#tCur').textContent = fmt(audio.currentTime);
      updateLyrics();
      if (audio.duration) $('#seek').value = Math.round((audio.currentTime / audio.duration) * 1000);
    });
    audio.addEventListener('error', () => { if (idx >= 0 && audio.error && audio.error.code !== 1) toast(T('playFail')); });

    $('#seek').addEventListener('input', (e) => {
      if (room || !audio.duration) return;   // in a room the slider only sends on release
      audio.currentTime = (e.target.value / 1000) * audio.duration;
    });
    $('#seek').addEventListener('change', (e) => {
      if (!room || !audio.duration || roomGuard()) return;
      roomControl('seek', { position: (e.target.value / 1000) * audio.duration });
    });
    $('#playBtn').addEventListener('click', togglePlay);
    $('#nextBtn').addEventListener('click', next);
    $('#prevBtn').addEventListener('click', prev);

    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.setActionHandler('play', () => audio.play());
        navigator.mediaSession.setActionHandler('pause', () => audio.pause());
        navigator.mediaSession.setActionHandler('previoustrack', prev);
        navigator.mediaSession.setActionHandler('nexttrack', next);
      } catch {}
    }

    /* ---------------- swipe (left = next, right = prev) ---------------- */
    function bindSwipe(node) {
      let x0 = null, y0 = 0, t0 = 0;
      node.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1 || e.target.closest('input, button')) { x0 = null; return; }
        x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
      }, { passive: true });
      node.addEventListener('touchend', (e) => {
        if (x0 === null) return;
        const p = e.changedTouches[0];
        const dx = p.clientX - x0, dy = p.clientY - y0;
        const quick = Date.now() - t0 < 800;
        x0 = null;
        if (quick && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          if (dx < 0) next(); else prev();
        }
      }, { passive: true });
    }
    bindSwipe($('#player'));
    bindSwipe($('#stage'));

    /* ---------------- tabs ---------------- */
    function showView(name) {
      document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === 'view-' + name));
      document.querySelectorAll('.tab').forEach((b) => {
        const on = b.dataset.view === name;
        b.classList.toggle('on', on);
        b.setAttribute('aria-current', on ? 'page' : 'false');
      });
      $('#main').scrollTop = 0;
      if (name === 'together') renderHostSongs();
    }
    document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => showView(b.dataset.view)));

    /* ---------------- upload (multi-file, sequential) ---------------- */
    const AUDIO_EXT = /\.(mp3|m4a|wav|flac|aac|ogg|oga|opus|mp4|webm)$/i;
    function isAudio(f) {
      return f.type === '' || f.type === 'application/octet-stream' ||
             f.type.startsWith('audio/') || f.type.startsWith('video/') ||
             AUDIO_EXT.test(f.name);
    }

    function logRow(name) {
      const row = el('li', {},
        el('span', { class: 'n' }, name),
        el('span', { class: 's' }, T('uploading')));
      $('#uploadLog').append(row);
      return {
        set(kind, text) {
          row.className = kind;
          row.lastChild.textContent = text;
        }
      };
    }

    const MAX_UPLOAD = 500 * 1024 * 1024;
    // iCloud / NAS files often arrive with an empty type; without a real audio type the file will not play
    const MIME_BY_EXT = {
      mp3: 'audio/mpeg', m4a: 'audio/mp4', mp4: 'video/mp4', wav: 'audio/wav', flac: 'audio/flac',
      aac: 'audio/aac', ogg: 'audio/ogg', oga: 'audio/ogg', opus: 'audio/ogg', webm: 'video/webm'
    };
    function mimeFor(file) {
      if (file.type && file.type !== 'application/octet-stream') return file.type;
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      return MIME_BY_EXT[ext] || 'application/octet-stream';
    }
    async function uploadOne(file, onPct, meta = {}) {
      if (file.size > MAX_UPLOAD) throw new Error(T('tooBig'));
      // unique prefix: Blob is called with addRandomSuffix:false, so equal names would overwrite
      const safe = file.name.replace(/[^A-Za-z0-9._-]/g, '_').slice(-120);
      const pathname = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${safe}`;
      const clientPayload = JSON.stringify({ token: getToken() });
      // 1) our server checks the signed-in account and issues a short-lived upload token
      const tokRes = await fetch('/api/blob-token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'blob.generate-client-token', payload: { pathname, callbackUrl: location.origin + '/api/blob-token', multipart: false, clientPayload } })
      });
      const tok = await tokRes.json().catch(() => ({}));
      if (!tokRes.ok || !tok.clientToken) throw new Error(tok.error || T('uploadFail'));
      // 2) the browser sends the file straight to Blob; a 3-minute limit stops a stalled transfer
      const ac = new AbortController();
      const timer = setTimeout(() => ac.abort(), 180000);
      let putRes, putText;
      try {
        putRes = await fetch(`https://blob.vercel-storage.com/${encodeURI(pathname)}`, {
          method: 'PUT',
          headers: {
            authorization: `Bearer ${tok.clientToken}`,
            'x-api-version': '7',
            // same format the SDK uses: <store id from the token>:<time>:<random>
            'x-api-blob-request-id': `${tok.clientToken.split('_')[3] || ''}:${Date.now()}:${Math.random().toString(16).slice(2)}`,
            'x-api-blob-request-attempt': '0',
            'x-content-type': mimeFor(file)
          },
          body: file,
          signal: ac.signal
        });
        putText = await putRes.text();
      } catch (err) {
        if (err.name === 'AbortError') throw new Error(T('timeout'));
        throw err;
      } finally { clearTimeout(timer); }
      if (!putRes.ok) throw new Error(T('uploadFail'));
      const blob = JSON.parse(putText);

      const fromName = file.name.replace(/\.[^/.]+$/, '').replace(/[_-]+/g, ' ').trim().slice(0, 80);
      const title = meta.title || fromName || 'Untitled';
      if (onPct) onPct(T('saving'));
      const saved = await api('/api/songs', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, artist: meta.artist || null, url: blob.url, size: file.size, lyrics: meta.lyrics || null, year: meta.year || null })
      });
      return saved.song;
    }

    let busy = false;
    async function handleFiles(fileList) {
      if (busy) return;
      const files = [...fileList];
      if (!files.length) return;
      busy = true;
      $('#pickBtn').disabled = true;
      $('#uploadLog').textContent = '';

      // .lrc files are paired with the audio file that has the same name
      const baseName = (n) => n.replace(/\.[^/.]+$/, '').toLowerCase();
      const lrcs = new Map();
      const valid = [];
      for (const f of files) {
        if (/\.lrc$/i.test(f.name)) lrcs.set(baseName(f.name), f);
        else if (isAudio(f)) valid.push(f);
        else logRow(f.name).set('err', T('badType'));
      }
      const yearVal = parseInt($('#yearInput').value, 10);
      const year = yearVal >= 1900 && yearVal <= 2100 ? yearVal : null;
      const artist = $('#artistInput').value.trim() || null;
      // a typed title only makes sense for a single file; several files keep their own names
      const titleOne = valid.length === 1 ? $('#titleInput').value.trim() || null : null;

      let okCount = 0;
      let firstId = null;
      for (let i = 0; i < valid.length; i++) {
        const f = valid[i];
        const row = logRow(f.name);
        $('#pickBtn').textContent = T('uploadProgress', i + 1, valid.length);
        try {
          const lrc = lrcs.get(baseName(f.name));
          const lyrics = lrc ? await lrc.text() : null;
          const song = await uploadOne(f, (v) => row.set('', typeof v === 'number' ? `${v}%` : v),
            { lyrics, year, artist, title: titleOne });
          if (!firstId && song) firstId = song.id;
          okCount++;
          row.set('ok', T('done'));
        } catch (e) {
          if (e.message === 'unauthorized') { row.set('err', T('sessionEnded')); break; }
          row.set('err', `${T('uploadFail')}: ${e.message}`);
        }
      }

      $('#fileInput').value = '';
      $('#titleInput').value = '';
      $('#artistInput').value = '';
      $('#pickBtn').textContent = T('pickFiles');
      $('#pickBtn').disabled = false;
      busy = false;
      await loadSongs();
      if (okCount) {
        toast(T('uploadOk', okCount));
        // success: close the upload page, go home and start the first new track
        setTimeout(() => {
          showView('home');
          const at = songs.findIndex((s) => s.id === firstId);
          if (at >= 0) playIndex(at);
        }, 1200);
      }
    }

    $('#searchInput').addEventListener('input', () => renderLibrary());
    $('#pickBtn').addEventListener('click', () => $('#fileInput').click());
    $('#fileInput').addEventListener('change', (e) => handleFiles(e.target.files));

    /* ---------------- settings: language + install ---------------- */
    function applyLang() {
      document.documentElement.lang = lang;
      document.querySelectorAll('[data-i18n]').forEach((n) => { n.textContent = T(n.dataset.i18n); });
      document.querySelectorAll('.lang-btn').forEach((b) => {
        b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
      });
      $('#pickBtn').textContent = T('pickFiles');
      renderLibrary();
      updatePlayer();
      document.querySelectorAll('[data-i18n-ph]').forEach((n) => { n.placeholder = T(n.dataset.i18nPh); });
      setAuthMode(authMode);
    }
    document.querySelectorAll('.lang-btn').forEach((b) => b.addEventListener('click', () => {
      lang = b.dataset.lang;
      store.set('lp_lang', lang);
      applyLang();
      applyPrivacy();
    }));

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      $('#installBtn').hidden = false;
    });
    $('#installBtn').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice.catch(() => {});
      deferredPrompt = null;
      $('#installBtn').hidden = true;
    });
    window.addEventListener('appinstalled', () => {
      $('#installBtn').hidden = true;
      $('#iosHint').hidden = true;
      $('#installedMsg').hidden = false;
    });
    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (standalone) $('#installedMsg').hidden = false;
    else if (isIOS) $('#iosHint').hidden = false;

    /* ---------------- native-app lock-down ---------------- */
    // no pinch-zoom (iOS Safari)
    ['gesturestart', 'gesturechange', 'gestureend'].forEach((ev) =>
      document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
    // no page-level drag: only the list (.views) may scroll, and only inside itself
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1) { e.preventDefault(); return; }
      if (!e.target.closest('.views')) e.preventDefault();
    }, { passive: false });
    // no long-press menu / image drag / text-selection popups
    document.addEventListener('contextmenu', (e) => { if (!e.target.closest('input')) e.preventDefault(); });
    document.addEventListener('dragstart', (e) => e.preventDefault());
    // if the browser ever scrolls the fixed shell (focus, address bar), snap it back
    window.addEventListener('scroll', () => { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); }, { passive: true });
    // light haptic tick on taps where the device supports it
    const tick = () => { try { navigator.vibrate && navigator.vibrate(8); } catch {} };
    document.addEventListener('click', (e) => { if (e.target.closest('button')) tick(); }, true);

    /* ---------------- boot ---------------- */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    $('#lockForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = $('#authEmail').value.trim();
      const password = $('#authPw').value;
      if (!email || !password) return;
      $('#authSubmit').disabled = true;
      try {
        const r = await fetch(authMode === 'login' ? '/api/auth/login' : '/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
        store.set(TOKEN_NAME, data.token);
        store.set(EMAIL_NAME, data.user.email);
        $('#authPw').value = '';
        $('#lockErr').hidden = true;
        $('#lock').hidden = true;
        renderAccount();
        loadSongs();
      } catch (err) {
        $('#lockErr').textContent = err.message;
        $('#lockErr').hidden = false;
      } finally {
        $('#authSubmit').disabled = false;
      }
    });
    document.querySelectorAll('.seg-btn').forEach((b) => b.addEventListener('click', () => setAuthMode(b.dataset.mode)));
    $('#logoutBtn').addEventListener('click', () => endSession(''));

    applyLang();
    applyPrivacy();
    renderAccount();
    if (getToken()) loadSongs(); else showAuth('');
  })();
  </script>
</body>
</html>
